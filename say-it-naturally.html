<title>Say It Naturally</title>
<meta name="description" content="A personal English coach: conversation practice, writing feedback, daily practice and progress tracking.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --paper:#F3F5F9;--surface:#FFFFFF;--surface-2:#EBEEF5;--sunk:#E6EAF2;
  --ink:#151A2D;--ink-2:#465071;--ink-3:#6B7392;--line:#DCE1EB;--line-2:#C5CCDC;
  --accent:#2A3CC0;--accent-ink:#2536B0;--accent-soft:#E7EAFB;--on-accent:#FFFFFF;
  --err:#BA3027;--err-soft:#FBEAE8;--fix:#15714A;--fix-soft:#E0F2E8;
  --hl:#E9C22C;--hl-band:#FBE38A;--hl-soft:#FFF6CF;--warn:#935700;--warn-soft:#FCF0DA;
  --shadow:0 1px 2px rgba(21,26,45,.05),0 8px 24px -12px rgba(21,26,45,.16);
  --f-display:"Bricolage Grotesque","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r-sm:8px;--r:12px;--r-lg:16px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E111B;--surface:#161A28;--surface-2:#1F2436;--sunk:#12151F;
    --ink:#E6E8F1;--ink-2:#AAB0C8;--ink-3:#8189A7;--line:#272D42;--line-2:#363D58;
    --accent:#8E9BFF;--accent-ink:#A9B3FF;--accent-soft:#222A55;--on-accent:#0E111B;
    --err:#FF8D80;--err-soft:#3B1D21;--fix:#62D3A0;--fix-soft:#123127;
    --hl:#E2C13B;--hl-band:rgba(226,193,59,.34);--hl-soft:#35301A;--warn:#F1B65E;--warn-soft:#372A14;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E111B;--surface:#161A28;--surface-2:#1F2436;--sunk:#12151F;
  --ink:#E6E8F1;--ink-2:#AAB0C8;--ink-3:#8189A7;--line:#272D42;--line-2:#363D58;
  --accent:#8E9BFF;--accent-ink:#A9B3FF;--accent-soft:#222A55;--on-accent:#0E111B;
  --err:#FF8D80;--err-soft:#3B1D21;--fix:#62D3A0;--fix-soft:#123127;
  --hl:#E2C13B;--hl-band:rgba(226,193,59,.34);--hl-soft:#35301A;--warn:#F1B65E;--warn-soft:#372A14;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.015em;line-height:1.15;text-wrap:balance;margin:0}
p,ul,ol,dl,dd{margin:0}
ul,ol{padding-left:1.25em}
.lbl{font-family:var(--f-mono);font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:13.5px}
.grow{flex:1}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.boot{padding:64px 16px;text-align:center;color:var(--ink-2)}
.err{color:var(--err);font-size:14.5px}
.empty{padding:20px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--ink-2)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);background:color-mix(in srgb,var(--paper) 86%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{border:0;background:none;padding:4px 0;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.hlw{background:linear-gradient(transparent 56%,var(--hl-band) 56%,var(--hl-band) 94%,transparent 94%);padding:0 3px}
.topnav{display:flex;gap:2px;margin-left:8px}
.navlink{border:0;background:none;padding:7px 11px;border-radius:8px;color:var(--ink-2);font-size:14.5px}
.navlink:hover{background:var(--surface-2);color:var(--ink)}
.navlink.on{color:var(--accent-ink);background:var(--accent-soft)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px}
.lvl{border:1px solid var(--line-2);background:var(--surface);border-radius:999px;padding:3px 11px;font-family:var(--f-mono);font-size:12.5px;font-weight:500}
.iconbtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:10px;border:1px solid transparent;background:none;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
@media (max-width:760px){.topnav{display:none}}

/* layout */
.wrap{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 72px}
@media (min-width:760px){.wrap{padding-inline:28px;padding-block:40px 88px}}
.page{display:flex;flex-direction:column;gap:28px}
.page-h{display:flex;flex-direction:column;gap:8px}
.page-h h1{font-size:clamp(30px,5vw,40px)}
.lead{font-size:17px;color:var(--ink-2);max-width:64ch}
.block{display:flex;flex-direction:column;gap:14px}
.block-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px}
.block-h h2{font-size:21px}
.banner{padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);font-size:14.5px;margin-bottom:24px}

/* buttons, chips, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 16px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;line-height:1.2;transition:border-color .15s,background .15s}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08)}
.btn.sm{padding:6px 11px;font-size:13.5px;border-radius:9px}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.linkbtn{border:0;background:none;padding:2px 0;color:var(--accent-ink);font-weight:700;font-size:14.5px;display:inline-flex;align-items:center;gap:5px}
.linkbtn:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:14.5px;color:var(--ink)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.big{padding:9px 16px;font-size:15.5px}
.chip.mist{display:inline-flex;gap:8px;align-items:center}
.chip.mist b{font-family:var(--f-mono);font-size:12.5px;color:var(--err)}
.tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.err{background:var(--err-soft);color:var(--err)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.acc{background:var(--accent-soft);color:var(--accent-ink)}
.input{width:100%;border:1px solid var(--line-2);background:var(--surface);border-radius:10px;padding:10px 12px;font-size:16px;line-height:1.5}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:44px}
.area{min-height:200px}
.kbd{font-family:var(--f-mono);font-size:12px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}
.note{padding:14px 16px;border-radius:var(--r);background:var(--surface-2);color:var(--ink-2);font-size:14.5px}
.note b{color:var(--ink)}
.say{border:0;background:none;padding:3px;color:var(--ink-3);display:inline-grid;place-items:center;border-radius:6px;vertical-align:middle}
.say:hover{color:var(--accent-ink);background:var(--accent-soft)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:.9}}
.thinking{display:inline-flex;align-items:center;gap:10px;color:var(--ink-2);font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:10px;font-size:14.5px;z-index:50;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-top:4px}
.hero h1{font-size:clamp(34px,6vw,50px);letter-spacing:-.03em;max-width:15ch}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.tiles{grid-template-columns:1fr}}
.tile{text-align:left;display:flex;flex-direction:column;gap:6px;padding:22px 22px 18px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:188px;transition:border-color .15s,transform .15s,box-shadow .15s}
.tile:hover{border-color:var(--accent);box-shadow:var(--shadow);transform:translateY(-1px)}
.tile.accent{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.tile-ic{color:var(--accent-ink);margin-bottom:6px}
.tile-t{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.1}
.tile-d{color:var(--ink-2);font-size:15px;max-width:44ch}
.tile-meta{margin-top:auto;padding-top:10px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.focus{display:flex;flex-direction:column;gap:12px;padding-top:6px}
.focus h2{font-size:19px}
@media (prefers-reduced-motion:reduce){.tile,.btn{transition:none}.tile:hover{transform:none}.dots i{animation:none;opacity:.6}}

/* onboarding */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.opts{grid-template-columns:1fr}}
.opt{text-align:left;display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.opt:hover{border-color:var(--accent)}
.opt .t{font-family:var(--f-display);font-weight:700;font-size:21px}
.opt .d{color:var(--ink-2);font-size:15px}
.levels{display:flex;flex-direction:column;gap:8px}
.levelbtn{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center;text-align:left;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink)}
.levelbtn:hover{border-color:var(--accent)}
.levelbtn b{font-family:var(--f-mono);font-size:17px;color:var(--accent-ink)}
.progressbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.progressbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{font-family:var(--f-display);font-size:clamp(22px,3.6vw,28px);font-weight:500;line-height:1.3;letter-spacing:-.01em;max-width:30ch}
.answers{display:grid;gap:10px;max-width:640px}
.ans{text-align:left;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);font-size:16.5px;color:var(--ink)}
.ans:hover{border-color:var(--accent)}
.ans.on{border-color:var(--accent);background:var(--accent-soft)}
.biglevel{font-family:var(--f-mono);font-size:64px;line-height:1;font-weight:500;color:var(--accent-ink)}

/* speaking setup */
.scen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.scen{text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.scen:hover{border-color:var(--accent)}
.scen b{font-size:16px}
.scen span{font-size:14px;color:var(--ink-2)}

/* chat */
.chat-top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 20px}
.chat-title h1{font-size:clamp(24px,4vw,30px)}
.chat-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.brief{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 20px;padding:14px 16px;border-radius:var(--r);background:var(--surface-2);font-size:14.5px}
@media (max-width:620px){.brief{grid-template-columns:1fr}}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{position:relative;max-width:min(640px,88%);padding:10px 14px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.msg.partner{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;padding-right:36px}
.msg.partner .say{position:absolute;right:6px;top:7px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:6px}
.msg.typing{color:var(--ink-2)}
.used{margin-top:6px;font-size:12.5px;opacity:.9;display:flex;gap:5px;align-items:center}
.chat-err{align-self:stretch;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 14px;border-radius:var(--r);background:var(--err-soft);color:var(--err);font-size:14.5px}
.pill-note{align-self:center;display:inline-flex;gap:8px;align-items:center;font-size:13.5px;color:var(--ink-2);padding:5px 12px;border-radius:999px;background:var(--surface-2)}
.composer{position:sticky;bottom:0;z-index:5;padding-block:14px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--paper) 78%,transparent)}
.composer-in{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.composer-in:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;border:0;background:none;resize:none;padding:8px 0;font-size:16px;line-height:1.5;max-height:200px;outline:none}
.send{width:44px;height:44px;padding:0;border-radius:12px}
.composer-hint{font-size:12.5px;color:var(--ink-3);padding:6px 4px 0}
.scen-done{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px;border-radius:var(--r);background:var(--hl-soft);font-size:15px}

/* corrections */
.corrs{align-self:stretch;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;gap:16px;margin-block:6px}
.corrs-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.corrs-h .lbl{color:var(--err);font-size:12px}
.corrs-sub{font-size:13px;color:var(--ink-3);margin-left:10px}
.praise{display:flex;gap:7px;align-items:flex-start;color:var(--fix);font-size:15px}
.praise svg{flex:none;margin-top:3px}
.cgroup{display:flex;flex-direction:column;gap:10px}
.cgroup h4{font-family:var(--f-body);font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.corr{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.cgroup h4+.corr{border-top:0;padding-top:0}
.corr-tags{display:flex;flex-wrap:wrap;gap:6px}
.cgrid{display:grid;grid-template-columns:118px 1fr;gap:6px 14px;align-items:baseline}
.cgrid dt{font-family:var(--f-mono);font-size:10.5px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding-top:3px}
.cgrid dd{font-size:15.5px}
.cgrid dd.said{color:var(--ink-2);text-decoration:underline wavy color-mix(in srgb,var(--err) 60%,transparent);text-underline-offset:4px;text-decoration-thickness:1px}
.cgrid dd.hook{font-weight:700}
@media (max-width:560px){.cgrid{grid-template-columns:1fr;gap:1px}.cgrid dd{margin-bottom:6px}}
del{color:var(--err);background:var(--err-soft);text-decoration:line-through;text-decoration-thickness:1.5px;border-radius:3px;padding:0 2px}
ins{color:var(--fix);background:var(--fix-soft);text-decoration:none;font-weight:700;border-radius:3px;padding:0 2px}
.native{background:linear-gradient(transparent 54%,var(--hl-band) 54%);padding:0 1px}
.pron{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:15px}
.nat{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:var(--r);background:var(--sunk)}
.nat-row{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:baseline;font-size:15.5px}
@media (max-width:560px){.nat-row{grid-template-columns:1fr auto}.nat-row .lbl{grid-column:1/-1}}
.nat-why{font-size:14.5px;color:var(--ink-2)}
.nat-row>span,.lrow>span{justify-self:start;max-width:100%}
.hint-m{display:none}
@media (max-width:620px){.hint-d{display:none}.hint-m{display:inline}}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-bottom:4px}
.rung i{display:block;height:6px;border-radius:3px;background:var(--line)}
.rung span{display:block;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rung.you i{background:var(--ink-3)}
.rung.gap i{background:repeating-linear-gradient(90deg,var(--hl) 0 5px,transparent 5px 9px)}
.rung.up i{background:var(--hl)}
.rung.up span,.rung.here span{color:var(--ink);font-weight:500}
.rchip{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:5px;background:var(--surface);border:1px solid var(--line-2);white-space:nowrap;color:var(--ink-2)}
.rchip.r3{background:var(--hl-soft);border-color:var(--hl);color:var(--ink)}
.rchip.rx{background:var(--err-soft);border-color:transparent;color:var(--err)}
.phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.phrase{padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.phrase-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.phrase-en{font-size:16.5px;margin-right:2px}
.phrase-pl{color:var(--ink-2);font-size:14.5px}
.phrase-ex{font-style:italic;font-size:14.5px}
.phrase-alt{font-size:13.5px;color:var(--ink-3)}

/* feedback */
.fb{display:flex;flex-direction:column;gap:18px;padding:22px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);scroll-margin-top:80px}
.fb-head{font-size:clamp(21px,3.4vw,26px)}
.meters{display:grid;gap:9px}
.meter{display:grid;grid-template-columns:110px 1fr 54px;gap:12px;align-items:center;font-size:15px}
.track{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.meter b{font-variant-numeric:tabular-nums;text-align:right;font-size:16px}
.meter b small{color:var(--ink-3);font-weight:400;font-size:12px}
.fb-cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:620px){.fb-cols{grid-template-columns:1fr}}
.fb ul,.fb ol{display:flex;flex-direction:column;gap:6px;margin-top:6px;font-size:15.5px}
.remember li::marker{font-family:var(--f-mono);color:var(--accent-ink)}

/* writing */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}

function fitDoc(n) {

const Persist = {
  mode: 'local', settled: false, db: null, path: null, writing: {}, dirty: {}, timers: {}, fails: {},
  async init() {
    try {
      const c = window.claude;
      if (!c || typeof c.use !== 'function') return;
      const [db, user] = await Promise.all([c.use('db').catch(() => null), c.use('user').catch(() => null)]);
      if (!db || !user) return;
      const id = await user.id();
      if (!id) return;
      this.path = n => 'data/users/' + id + '/' + n;
      for (const n of DOCS) {
        let snap = null;
        try { snap = await db.doc(this.path(n)).get(); }
        catch (e) {
          if (e && e.code === 'unavailable') { await sleep(700 + Math.random() * 700); snap = await db.doc(this.path(n)).get().catch(() => null); }
        }
        if (!snap) return;
        const remote = snap.exists ? sanitizeDoc(n, JSON.parse(JSON.stringify(snap.data()))) : null;
        if (remote && (remote.updatedAt || 0) >= (Store[n].updatedAt || 0)) { Store[n] = remote; lsSet(LS + n, remote); }
      }
      this.db = db; this.mode = 'cloud';
      DOCS.forEach(n => { if ((Store[n].updatedAt || 0) > 0) this.write(n); });
    } catch (e) { /* stays in browser storage */ }
    finally { this.settled = true; emit(); }
  },
  save(n) {
    fitDoc(n);
    lsSet(LS + n, Store[n]);
    if (!this.db) return;
    clearTimeout(this.timers[n]);
    this.fails[n] = 0;
    this.timers[n] = setTimeout(() => this.write(n), 900);
  },
  async write(n) {
    if (!this.db) return;
    if (this.writing[n]) { this.dirty[n] = true; return; }
    this.writing[n] = true;
    try { await this.db.doc(this.path(n)).set(JSON.parse(JSON.stringify(Store[n]))); this.fails[n] = 0; }
    catch (e) {
      const c = e && e.code;
      if (c === 'unavailable' || c === 'resource_exhausted') {
        this.fails[n] = (this.fails[n] || 0) + 1;
        if (this.fails[n] < 3) { this.dirty[n] = true; await sleep(1500 + Math.random() * 1500); }
      } else { this.db = null; this.mode = 'local'; emit(); }
    } finally {
      this.writing[n] = false;
      if (this.dirty[n] && this.db) { this.dirty[n] = false; this.write(n); }
    }
  }
};

/* ---------- learner model ---------- */
const INTERVALS = [1, 2, 4, 7, 15, 30];
const Mistakes = {
  get items() { return Store.mistakes.items; },
  find(k) { return this.items.find(m => m.key === k); },
  record(c) {
    const key = slug(c.mistake_key) || slug(c.mistake_label) || 'other';
    const now = Date.now();
    let m = this.find(key);
    const prev = m ? m.count : 0;
    if (!m) {
      m = { key, label: MISTAKE_TYPES[key] || str(c.mistake_label) || cap(key.replace(/-/g, ' ')), count: 0, firstSeen: now, lastSeen: now, box: 0, due: now, calques: 0, examples: [], lesson: null };
      this.items.push(m);
    }
    m.count += 1; m.lastSeen = now; m.box = 0; m.due = now;
    m.hist = [now].concat(arr(m.hist)).slice(0, 30);
    if (c.polish_calque) m.calques = (m.calques || 0) + 1;
    const ex = { wrong: str(c.you_said), right: str(c.better), natural: str(c.more_natural), why: str(c.why), at: now };
    if (ex.wrong && ex.right && !m.examples.some(e => norm(e.wrong) === norm(ex.wrong))) { m.examples.unshift(ex); m.examples = m.examples.slice(0, 4); }
    if (this.items.length > 60) {
      Store.mistakes.items = this.items.slice().sort((a, b) => (b.count * 10 + b.lastSeen / DAY) - (a.count * 10 + a.lastSeen / DAY)).slice(0, 60);
    }
    return prev + 1;
  },
  review(key, ok) {
    const m = this.find(key);
    if (!m) return;
    m.box = ok ? Math.min(5, m.box + 1) : 0;
    const f = m.count >= 5 ? 0.5 : m.count >= 3 ? 0.75 : 1;
    m.due = Date.now() + INTERVALS[m.box] * f * DAY;
    m.reviews = (m.reviews || 0) + 1; m.lastReview = Date.now();
  },
  priority(m) {
    const now = Date.now();
    const over = Math.max(0, (now - m.due) / DAY);
    return m.count * 2 + Math.min(over, 10) + (now >= m.due ? 4 : 0) - m.box * 1.5;
  },
  top(n) { return this.items.slice().sort((a, b) => this.priority(b) - this.priority(a)).slice(0, n); },
  status(m) {
    if (m.box >= 4) return ['control', 'Under control'];
    if (m.box >= 2) return ['improving', 'Improving'];
    if (m.count >= 2) return ['recurring', 'Recurring'];
    return ['new', 'Seen once'];
  }
};

const normPhrase = p => {
  const d = str(p && p.difficulty).toUpperCase();
  return { en: str(p && p.en), pl: str(p && p.pl), example: str(p && p.example), alternatives: arr(p && p.alternatives).map(str).filter(Boolean).slice(0, 3), difficulty: ['A2', 'B1', 'B2', 'C1', 'C2'].includes(d) ? d : 'B2', kind: str(p && p.kind).toLowerCase().slice(0, 24) };
};
const V_INT = [0, 1, 3, 7, 14, 30];
const vStatus = sc => sc >= 3 ? 'mastered' : sc >= 1 ? 'learning' : 'new';
function coreOf(en) {
  return norm(en.replace(/\(.*?\)/g, ' ').replace(/\+.*$/, ' ').replace(/(\.\.\.|…)/g, ' ').replace(/\b(sb|sth|someone|something|somebody|smb|one's)\b/gi, ' '));
}
const Vocab = {
  get items() { return Store.vocab.items; },
  add(p, source) {
    const x = normPhrase(p);
    if (!x.en) return null;
    const k = norm(x.en);
    let v = this.items.find(i => norm(i.en) === k);
    if (v) return v;
    v = Object.assign({ id: uid() }, x, { status: 'new', score: 0, used: 0, added: Date.now(), source: source || '' });
    this.items.unshift(v);
    if (this.items.length > 400) this.items.length = 400;
    return v;
  },
  bump(id, ok) {
    const v = this.items.find(i => i.id === id);
    if (!v) return;
    v.score = ok ? (v.score || 0) + 1 : Math.max(0, (v.score || 0) - 1);
    v.status = vStatus(v.score); v.lastReviewed = Date.now();
  },
  set(id, status) {
    const v = this.items.find(i => i.id === id);
    if (!v) return;
    v.status = status;
    v.score = status === 'mastered' ? 3 : status === 'learning' ? Math.min(2, Math.max(1, v.score || 1)) : 0;
  },
  remove(id) { Store.vocab.items = this.items.filter(i => i.id !== id); },
  review(id, g) {
    const v = this.items.find(i => i.id === id);
    if (!v) return;
    const now = Date.now();
    v.reviews = (v.reviews || 0) + 1; v.lastReviewed = now;
    if (g === 2) { v.box = Math.min(5, (v.box || 0) + 1); v.score = (v.score || 0) + 1; v.due = now + V_INT[v.box] * DAY; }
    else if (g === 1) { v.box = Math.max(1, v.box || 0); v.due = now + DAY; }
    else { v.box = 0; v.score = Math.max(0, (v.score || 0) - 1); v.due = now; }
    v.status = vStatus(v.score);
  },
  isDue(v, now) { return v.due == null ? v.status !== 'mastered' : v.due <= now; },
  due(n) {
    const now = Date.now();
    const rank = { learning: 0, new: 1, mastered: 2 };
    return this.items.filter(v => this.isDue(v, now)).sort((a, b) => (rank[a.status] - rank[b.status]) || ((a.due || a.added || 0) - (b.due || b.added || 0))).slice(0, n || 999);
  },
  nextDue() { const t = this.items.filter(v => v.due != null && v.due > Date.now()).map(v => v.due); return t.length ? Math.min.apply(null, t) : null; },
  detectUse(text) {
    const t = ' ' + norm(text) + ' ';
    const now = Date.now();
    const used = [];
    this.items.forEach(v => {
      if (v.status === 'mastered') return;
      const core = coreOf(v.en);
      if (core.length < 4 || core.indexOf(' ') < 0) return;
      if (t.includes(' ' + core + ' ') && !(v.lastUsed && now - v.lastUsed < 10 * 60000)) {
        v.used = (v.used || 0) + 1; v.score = (v.score || 0) + 1; v.status = vStatus(v.score); v.lastUsed = now;
        used.push(v);
      }
    });
    return used;
  }
};

function buildTurns(s) {
  const rules = partnerRules(s);
  const msgs = s.messages.slice(-40);

  const turns = [{ role: 'user', content: rules + '\n\n(The conversation follows. Reply only as your character.)' }];
  msgs.forEach(m => turns.push({ role: m.role === 'me' ? 'user' : 'assistant', content: m.text }));

const TTS = {

/* ---------- word diff ---------- */
function diffWords(a, b) {
  const A = str(a).match(/\S+\s*/g) || [], B = str(b).match(/\S+\s*/g) || [];
  const n = A.length, m = B.length;
  if (n * m > 1500000) return null;
  const eq = (x, y) => x.trim() === y.trim();
  const dp = [];
  for (let i = 0; i <= n; i++) dp.push(new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = eq(A[i], B[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const out = [];
  const push = (t, s) => { const l = out[out.length - 1]; if (l && l.t === t) l.s += s; else out.push({ t, s }); };
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (eq(A[i], B[j])) { push('eq', B[j]); i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) { push('del', A[i]); i++; }
    else { push('ins', B[j]); j++; }
  }
  while (i < n) push('del', A[i++]);
  while (j < m) push('ins', B[j++]);
  return out;
}
function diffText(a, b) {
  const pa = str(a).split('\n'), pb = str(b).split('\n');
  if (pa.length === pb.length) {
    const out = [];
    for (let k = 0; k < pa.length; k++) {
      const d = diffWords(pa[k], pb[k]);
      if (!d) return null;
      if (k) out.push({ t: 'eq', s: '\n' });
      out.push.apply(out, d);
    }
    return out;
  }
  return diffWords(a, b);
}

function Corrections({ batch, title, hidePhrases }) {

  const taken = new Set();
  const grouped = groups.map(([t, f]) => {
    const list = cs.filter(c => c.type !== 'pronunciation' && !taken.has(c) && f(c));
    list.forEach(c => taken.add(c));
    return [t, list];
  }).filter(g => g[1].length);
  const pron = r.pronunciation.concat(cs.filter(c => c.type === 'pronunciation').map(c => ({ word: c.you_said, tip: c.why })));

      ${pron.length ? html`<div class="cgroup"><h4>Pronunciation <span class="small" style="text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink-3)">· based on the words you used, not your voice</span></h4>${pron.map(p => html`<div class="pron"><b>${p.word}</b><span class="muted">${p.tip}</span><${Say} text=${p.word} /></div>`)}</div>` : null}

    ` : null}

const EX_LABEL = { gap: 'Fill the gap', rewrite: 'Rewrite using the phrase', respond: 'Answer using the phrase', fix: 'Correct the mistake', translate: 'Say it in English' };
function Exercises({ items, initial, onChecked, idPrefix }) {
  const [ans, setAns] = useState(() => (initial && initial.answers) || items.map(() => ''));
  const [res, setRes] = useState(() => (initial && initial.results) || null);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const setA = (i, v) => { const n = ans.slice(); n[i] = v; setAns(n); };
  async function check() {
    const todo = items.map((x, i) => Object.assign({}, x, { i, given: str(ans[i]) })).filter(x => x.given);
    if (!todo.length) { setErr('Type at least one answer first.'); return; }
    setBusy(true); setErr('');
    try {
      const r = await aiJSON(checkPrompt(todo), { modelTier: 'quick', cache: false });
      const list = arr(r && r.results);
      const out = items.map((x, i) => {
        if (!str(ans[i])) return { ok: false, skipped: true, feedback: '', better: x.answer };
        const y = list.find(z => z && Number(z.i) === i) || {};
        return { ok: !!y.ok, feedback: str(y.feedback), better: str(y.better) || x.answer };
      });
      const first = !res;
      setRes(out);
      if (onChecked) onChecked(out, ans, first);
    } catch (e) { setErr(errText(e)); }
    finally { setBusy(false); }
  }
  const score = res ? res.filter(x => x.ok).length : 0;
  return html`<div class="exs">
    ${items.map((x, i) => html`<div class=${'ex' + (res ? (res[i].ok ? ' ok' : ' no') : '')}>
      <div class="ex-h"><span class="lbl">${i + 1}. ${x.group ? x.group + ' · ' : ''}${EX_LABEL[x.type] || 'Exercise'}</span>${x.target ? html`<span class="ex-target">${x.target}</span>` : null}</div>
      <p class="ex-p">${x.prompt}</p>
      <textarea id=${idPrefix + '-' + i} class="input" rows="2" value=${ans[i] || ''} onInput=${e => setA(i, e.target.value)} disabled=${busy} placeholder="Your answer…" aria-label=${'Answer ' + (i + 1)}></textarea>
      ${res ? html`<div class="ex-r">
        <div>${res[i].ok ? html`<b class="okt"><${Icon} n="check" s=${15} /> Correct</b>` : html`<b class="not">${res[i].skipped ? 'Skipped' : 'Not quite'}</b>`}${res[i].feedback ? ' · ' + res[i].feedback : ''}</div>
        ${res[i].better ? html`<div class="ex-better"><span class="lbl">Natural answer</span> ${res[i].better}</div>` : null}
      </div>` : null}
    </div>`)}
    ${err ? html`<p class="err" role="alert">${err}</p>` : null}
    <div class="row">${res ? html`<span class="score">${score} / ${items.length} correct</span>` : null}<div class="grow"></div>
      ${busy ? html`<${Thinking} label="Checking" />` : html`<button class="btn primary" onClick=${check}>${res ? 'Check again' : 'Check answers'}</button>`}</div>
  </div>`;
}

function Diagnostic({ go, onCancel }) {
  const [i, setI] = useState(0);
  const [picks, setPicks] = useState([]);
  const [phase, setPhase] = useState('mc');
  const [a1, setA1] = useState('');
  const [a2, setA2] = useState('');
  const [busy, setBusy] = useState(false);
  const [note, setNote] = useState('');
  const [result, setResult] = useState(null);
  const q = DIAG[i];
  function choose(k) {
    const np = picks.slice(); np[i] = k; setPicks(np);
    setTimeout(() => { if (i < DIAG.length - 1) setI(i + 1); else setPhase('open'); }, 160);
  }
  async function evaluate(skip) {
    const score = DIAG.reduce((n, d, j) => n + (picks[j] === d.ans ? 1 : 0), 0);
    const missed = DIAG.map((d, j) => Object.assign({}, d, { picked: picks[j] })).filter(d => d.picked !== d.ans);
    const res = { level: mcToLevel(score), score, missed, summary: '', strengths: [], focus: [], source: 'quiz' };
    if (!skip && words(a1) + words(a2) >= 10) {
      setBusy(true); setNote('');
      try {
        const r = await aiJSON(diagPrompt(score, missed, a1, a2), { modelTier: 'default' });
        const L = levelNorm(r && r.level);
        if (L) { res.level = L; res.source = 'ai'; }
        res.summary = str(r && r.summary);
        res.strengths = arr(r && r.strengths).map(str).filter(Boolean).slice(0, 3);
        res.focus = arr(r && r.focus).map(f => ({ you_said: str(f && f.you_said), better: str(f && f.better), more_natural: str(f && f.better), why: str(f && f.why), mistake_key: slug(f && f.mistake_key), mistake_label: str(f && f.mistake_label) })).filter(f => f.you_said && f.better).slice(0, 4);
      } catch (e) { setNote(errText(e) + ' Your level is based on the quiz for now.'); }
      setBusy(false);
    }
    setResult(res); setPhase('result');
  }
  function start() {
    const p = Store.profile, r = result;
    p.level = r.level; p.levelSource = r.source === 'ai' ? 'test' : 'quiz'; p.onboarded = true;
    p.levelHistory.push({ date: new Date().toISOString(), level: r.level, source: 'check' });
    if (r.strengths.length) p.strengths = r.strengths;
    r.missed.forEach(d => Mistakes.record({ mistake_key: d.key, you_said: d.picked >= 0 ? fillBlank(d, d.picked) : '', better: fillBlank(d, d.ans), more_natural: fillBlank(d, d.ans), why: d.why }));
    r.focus.forEach(f => Mistakes.record(f));
    commit('mistakes'); commit('profile');
    go('home');
  }
  if (phase === 'mc') return html`<div class="page">
    <header class="page-h"><div class="row"><span class="lbl">Level check · question ${i + 1} of ${DIAG.length}</span><div class="grow"></div><button class="linkbtn" onClick=${onCancel}>Cancel</button></div>
      <div class="progressbar"><i style=${'width:' + (i / DIAG.length * 100) + '%'}></i></div></header>
    <p class="q">${q.q}</p>
    <div class="answers">${q.opts.map((o, k) => html`<button class=${'ans' + (picks[i] === k ? ' on' : '')} onClick=${() => choose(k)}>${o}</button>`)}</div>
    <div class="row">${i > 0 ? html`<button class="linkbtn" onClick=${() => setI(i - 1)}><${Icon} n="back" s=${16} /> Previous</button>` : null}<div class="grow"></div><button class="linkbtn" onClick=${() => choose(-1)}>I don’t know</button></div>
  </div>`;
  if (phase === 'open') return html`<div class="page">
    <header class="page-h"><span class="lbl">Level check · writing</span><h1>Two short answers</h1><p class="lead">Write 3–5 sentences for each. Don’t look anything up; mistakes are useful here. The AI uses them to find your first focus areas.</p></header>
    <div class="form">
      <label class="lbl" for="diag-a1">1. Describe a typical day at work or school. What do you actually do?</label>
      <textarea id="diag-a1" class="input" rows="5" value=${a1} onInput=${e => setA1(e.target.value)}></textarea>
      <label class="lbl" for="diag-a2">2. If you could live in any country for a year, where would you go and why?</label>
      <textarea id="diag-a2" class="input" rows="5" value=${a2} onInput=${e => setA2(e.target.value)}></textarea>
    </div>
    <div class="row">${busy ? html`<${Thinking} label="Reading your answers" />` : html`
      <button class="btn primary" onClick=${() => evaluate(false)} disabled=${words(a1) + words(a2) < 10}>See my level</button>
      <button class="linkbtn" onClick=${() => evaluate(true)}>Skip, use the quiz only</button>`}</div>
  </div>`;
  const r = result;
  return html`<div class="page">
    <header class="page-h"><span class="lbl">Your starting level</span>
      <div class="lvlbox"><div class="biglevel">${r.level}</div><div><p class="lead">${LEVEL_INFO[r.level] || ''}</p><p class="small muted">Quiz: ${r.score} / ${DIAG.length}${r.source === 'ai' ? ' · level estimated from your writing and the quiz' : ' · level estimated from the quiz'}</p></div></div>
    </header>
    ${note ? html`<p class="err">${note}</p>` : null}
    ${r.summary ? html`<p class="lead" style="color:var(--ink)">${r.summary}</p>` : null}
    ${r.strengths.length ? html`<div class="block"><h2 style="font-size:19px">Strengths</h2><div class="chips">${r.strengths.map(s => html`<span class="chip">${s}</span>`)}</div></div>` : null}
    ${r.focus.length || r.missed.length ? html`<div class="block"><h2 style="font-size:19px">Your first focus areas</h2>
      ${r.focus.map(f => html`<div class="corrs" style="margin:0"><dl class="cgrid"><dt>You wrote</dt><dd class="said">“${f.you_said}”</dd><dt>Better</dt><dd><${DiffView} ops=${diffWords(f.you_said, f.better)} fallback=${f.better} /></dd>${f.why ? html`<dt>Why</dt><dd>${f.why}</dd>` : null}</dl></div>`)}
      ${r.missed.length ? html`<p class="muted">From the quiz: ${r.missed.map(d => MISTAKE_TYPES[d.key]).join(' · ')}</p>` : null}
    </div>` : null}
    <div class="row"><button class="btn primary" onClick=${start}>Start practising</button></div>
  </div>`;
}

/* ---------- chat engine ---------- */
function useChat(init, opts) {
  opts = opts || {};
  const ref = useRef(init);
  const ctl = useRef(null);
  const aRef = useRef(false);
  const alive = useRef(true);
  const [, tick] = useState(0);
  const [busy, setBusy] = useState(false);
  const [stream, setStream] = useState('');
  const [err, setErr] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const save = () => { if (opts.onSave) opts.onSave(ref.current); if (alive.current) tick(n => n + 1); };
  const pending = () => { const s = ref.current; return s.messages.slice(s.analyzedUpTo).filter(m => m.role === 'me').length; };

  async function reply() {
    const s = ref.current;
    setErr(null); setBusy(true); setStream('');
    const c = new AbortController();
    ctl.current = c;
    try {
      const r = await aiText(buildTurns(s), { cache: false, modelTier: 'quick', signal: c.signal, onText: u => { if (alive.current) setStream(u.text.replace(/\[END\]/gi, '').trim()); } });
      let t = str(r.text);
      const ended = /\[END\]/i.test(t);
      t = t.replace(/\[END\]/gi, '').trim();
      if (t) s.messages.push({ id: uid(), role: 'partner', text: t, t: Date.now() });
      if (ended && s.scenario && !s.warmup) s.scenarioDone = true;
      save();
      if (t && alive.current && lsGet(LS + 'autoread')) TTS.speak(t);
    } catch (e) {
      if (!(e && e.code === 'cancelled') && alive.current) setErr({ text: 'No reply. ' + errText(e), kind: 'reply' });
    } finally {
      if (alive.current) { setBusy(false); setStream(''); }
    }
  }

  async function analyze(max, rethrow, aopts) {
    const s = ref.current;
    if (aRef.current) return null;
    const from = s.analyzedUpTo, to = s.messages.length;
    const count = s.messages.slice(from, to).filter(m => m.role === 'me').length;
    if (!count) return null;
    aRef.current = true; setAnalyzing(true);
    if (err && err.kind === 'analysis') setErr(null);
    s.analyzedUpTo = to; save();
    try {
      const raw = await aiJSON(analysisPrompt(s, from, to, max || 5, aopts), { modelTier: 'default' });
      const result = normAnalysis(raw);
      recordAnalysis(result, s.warmup ? 'daily' : 'speaking');
      const b = { id: uid(), at: s.messages.length, count, result };
      s.batches.push(b);
      save();
      return b;
    } catch (e) {
      s.analyzedUpTo = from; save();
      if (rethrow) throw e;
      if (alive.current) setErr({ text: 'Couldn’t check your messages. ' + errText(e), kind: 'analysis' });
      return null;
    } finally {
      aRef.current = false;
      if (alive.current) setAnalyzing(false);
    }
  }

  function send(text) {
    const s = ref.current;
    const t = str(text);
    if (!t) return;
    const used = Vocab.detectUse(t);
    s.messages.push({ id: uid(), role: 'me', text: t, t: Date.now(), used: used.map(v => v.en) });
    if (used.length) commit('vocab');
    save();
    reply();
    if (opts.autoCorrect && pending() >= (Store.profile.correctionsEvery || 4)) analyze(5);
  }

  useEffect(() => {
    alive.current = true;
    const s = ref.current;
    const last = s.messages[s.messages.length - 1];
    if (!s.ended && (!last || last.role === 'me')) reply();
    return () => { alive.current = false; if (ctl.current) ctl.current.abort(); };
  }, []);

  return { s: ref.current, busy, stream, err, analyzing, send, analyze, reply, save, pending, retry: () => (err && err.kind === 'analysis' ? analyze(5) : reply()) };
}

function Bubble({ m }) {
  if (m.role === 'me') return html`<div class="msg me">${m.text}${m.used && m.used.length ? html`<div class="used"><${Icon} n="check" s=${13} /> You used: ${m.used.join(', ')}</div>` : null}</div>`;
  return html`<div class="msg partner">${m.text}<${Say} text=${m.text} /></div>`;
}

function Composer({ chat, placeholder }) {
  const [t, setT] = useState('');
  const ta = useRef(null);
  const coarse = useRef(false);
  useEffect(() => { try { coarse.current = matchMedia('(pointer: coarse)').matches; } catch (e) {} }, []);
  const off = AI.status === 'unavailable' || AI.status === 'denied';
  function submit() {
    const v = t.trim();
    if (!v || chat.busy || off) return;
    chat.send(v);
    setT('');
    if (ta.current) ta.current.style.height = '';
  }
  function onKey(e) { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && !coarse.current) { e.preventDefault(); submit(); } }
  function onInput(e) { setT(e.target.value); const el = e.target; el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 200) + 'px'; }
  return html`<div class="composer">
    <div class="composer-in">
      <textarea id="chat-input" ref=${ta} rows="1" value=${t} onInput=${onInput} onKeyDown=${onKey} placeholder=${placeholder || 'Reply in English…'} aria-label="Your message"></textarea>
      <button class="btn primary send" onClick=${submit} disabled=${!t.trim() || chat.busy || off} aria-label="Send"><${Icon} n="send" s=${20} /></button>
    </div>
    <div class="composer-hint"><span class="hint-d">Enter sends · Shift+Enter adds a line · To speak instead of typing, use dictation: <span class="kbd">Win</span>+<span class="kbd">H</span> on Windows or <span class="kbd">Fn</span> twice on Mac</span><span class="hint-m">Tip: tap the mic on your keyboard to speak instead of typing.</span></div>
  </div>`;
}

function ChatView({ chat, composer, placeholder }) {
  const s = chat.s;
  const endRef = useRef(null);
  useEffect(() => {
    const el = endRef.current;
    if (!el) return;
    const near = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 320;
    if (near) el.scrollIntoView({ block: 'end' });
  }, [s.messages.length, chat.stream, s.batches.length, chat.busy]);
  const items = [];
  s.messages.forEach((m, i) => {
    s.batches.filter(b => b.at === i).forEach(b => items.push(html`<${Corrections} key=${b.id} batch=${b} />`));
    items.push(html`<${Bubble} key=${m.id} m=${m} />`);
  });
  s.batches.filter(b => b.at >= s.messages.length).forEach(b => items.push(html`<${Corrections} key=${b.id} batch=${b} />`));
  return html`<div class="chat" aria-live="polite">
      ${items}
      ${chat.busy ? html`<div class="msg partner typing">${chat.stream || html`<span class="dots"><i></i><i></i><i></i></span>`}</div>` : null}
      ${chat.err ? html`<div class="chat-err" role="alert"><span>${chat.err.text}</span><button class="btn sm" onClick=${chat.retry}>Try again</button></div>` : null}
      ${chat.analyzing ? html`<div class="pill-note"><span class="dots"><i></i><i></i><i></i></span> Checking your last messages. Keep talking.</div>` : null}
      <div ref=${endRef}></div>
    </div>
    ${composer ? html`<${Composer} chat=${chat} placeholder=${placeholder} />` : null}`;
}

function MySituations({ start }) {

function markOriginal(text, mistakes) {
  const ranges = [];
  mistakes.forEach((m, idx) => {
    const s = m.original;
    if (!s) return;
    let pos = text.indexOf(s);
    if (pos < 0) pos = text.toLowerCase().indexOf(s.toLowerCase());
    if (pos < 0) return;
    if (ranges.some(r => pos < r.end && pos + s.length > r.start)) return;
    ranges.push({ start: pos, end: pos + s.length, idx });
  });
  ranges.sort((a, b) => a.start - b.start);
  const out = [];
  let cur = 0;
  ranges.forEach(r => {
    if (r.start > cur) out.push(text.slice(cur, r.start));
    out.push(html`<mark class="m" title=${mistakes[r.idx].corrected}>${text.slice(r.start, r.end)}<sup>${r.idx + 1}</sup></mark>`);
    cur = r.end;
  });
  out.push(text.slice(cur));
  return out;
}

function WMistake({ m, i }) {
  const same = !m.natural || norm(m.natural) === norm(m.corrected);
  return html`<article class="corr">
    <div class="corr-tags"><span class="num">${i + 1}</span><span class="tag">${m.type}</span>
      ${m.repeat >= 2 ? html`<span class="tag err">Repeated ×${m.repeat}</span>` : null}
      ${m.polish_calque ? html`<span class="tag warn">Translated from Polish</span>` : null}
      ${m.mistake_label && !(m.polish_calque && m.mistake_key === 'polish-calque') ? html`<span class="tag">${MISTAKE_TYPES[m.mistake_key] || m.mistake_label}</span>` : null}</div>
    <dl class="cgrid">
      <dt>Original</dt><dd class="said">“${m.original}”</dd>
      <dt>Corrected</dt><dd><${DiffView} ops=${diffWords(m.original, m.corrected)} fallback=${m.corrected} /></dd>
      ${m.why ? html`<dt>Why</dt><dd>${m.why}</dd>` : null}
      <dt>Natural</dt><dd>${same ? html`<span>${m.corrected}</span>` : html`<span class="native">${m.natural}</span>`}</dd>
    </dl>
  </article>`;
}

function WritingResult({ res, orig }) {
  const ops = useMemo(() => diffText(orig, res.corrected), [orig, res.corrected]);
  const sc = res.scores;
  const fb = { scores: { grammar: sc.grammar, vocabulary: sc.vocabulary, naturalness: sc.naturalness, clarity: sc.clarity } };

    <section class="wsec"><h3><span class="letter">A</span>Original</h3>

    const t = text.trim();

/* ---------- daily practice ---------- */
const STEPS = ['Warm-up', 'Corrections', '5 phrases', 'Use them', 'Review', 'Summary'];
function pickDaily() {
  const recent = arr(Store.profile.lastTopics);
  const dayNum = Math.floor(Date.now() / DAY);
  if (dayNum % 2 === 0) {
    const pool = TOPICS.filter(t => !recent.includes(t.id));
    return { kind: 'topic', id: pick(pool.length ? pool : TOPICS).id };
  }
  const all = SCENARIOS.concat(arr(Store.profile.customScenarios));
  const pool = all.filter(s => !recent.includes(s.id));
  return { kind: 'scenario', id: pick(pool.length ? pool : all).id };
}
function newDaily() {
  const p = pickDaily();
  return { id: uid(), day: dayKey(), step: 1, maxStep: 1, chat: newSession(p.kind, p.id, true), reviewKeys: null, analysis: null, content: null, ex: null, review: null, rev: null, feedback: null, done: false, recorded: false };
}
function DailyHost({ go }) {
  const [round, setRound] = useState(0);
  return html`<${Daily} key=${round} go=${go} again=${() => { lsDel(DRAFT_DAILY); setRound(round + 1); window.scrollTo(0, 0); }} />`;
}
function WarmTimer({ start }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const id = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(id); }, []);
  const left = Math.max(0, 180 - Math.floor((now - start) / 1000));
  return html`<div class=${'timer' + (left ? '' : ' up')} aria-label="Time left">${left ? Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0') : 'Time’s up'}</div>`;
}

function Daily({ go, again }) {
  const dref = useRef(null);
  if (!dref.current) {
    const x = lsGet(DRAFT_DAILY);
    dref.current = x && x.day === dayKey() && x.chat && x.chat.messages ? x : newDaily();
  }
  const d = dref.current;
  const [, tick] = useState(0);
  const save = () => { lsSet(DRAFT_DAILY, dref.current); tick(n => n + 1); };
  const chat = useChat(d.chat, { onSave: () => lsSet(DRAFT_DAILY, dref.current) });
  const flight = useRef({});
  const [busy, setBusy] = useState({});
  const [errs, setErrs] = useState({});
  const setB = (k, v) => { flight.current[k] = v; setBusy(b => Object.assign({}, b, { [k]: v })); };
  const setE = (k, v) => setErrs(b => Object.assign({}, b, { [k]: v }));

  async function runAnalysis() {
    if (d.analysis || flight.current.analysis) return;
    setB('analysis', true); setE('analysis', '');
    try {
      const b = await chat.analyze(3, true, { noPhrases: true });
      const last = d.chat.batches[d.chat.batches.length - 1];
      d.analysis = b ? b.result : (last ? last.result : { corrections: [], naturalness: [], pronunciation: [], phrases: [], praise: '' });
      save();
      if (!d.reviewKeys || !d.reviewKeys.length) runReview();
    } catch (e) { setE('analysis', errText(e)); }
    finally { setB('analysis', false); }
  }
  async function runContent() {
    if (d.content || flight.current.content) return;
    setB('content', true); setE('content', '');
    try {
      const r = await aiJSON(dailyContentPrompt(d), { modelTier: 'default' });
      const phrases = arr(r && r.phrases).map(normPhrase).filter(p => p.en).slice(0, 5);
      if (!phrases.length) throw { code: 'invalid_json' };
      phrases.forEach(p => { const v = Vocab.add(p, 'daily'); if (v) p.vid = v.id; });
      commit('vocab');
      const exercises = arr(r.exercises).map(x => ({ phrase: Math.max(0, Math.min(phrases.length - 1, Number(x && x.phrase) || 0)), type: ['gap', 'rewrite', 'respond'].includes(x && x.type) ? x.type : 'respond', prompt: str(x && x.prompt), answer: str(x && x.answer) })).filter(x => x.prompt).slice(0, 5);
      d.content = { phrases, exercises };
      save();
    } catch (e) { setE('content', errText(e)); }
    finally { setB('content', false); }
  }
  async function runReview() {
    if (d.review || flight.current.review) return;
    const keys = d.reviewKeys && d.reviewKeys.length ? d.reviewKeys : Mistakes.top(3).map(m => m.key);
    const ms = keys.map(k => Mistakes.find(k)).filter(Boolean).slice(0, 3);
    if (!ms.length) { if (d.analysis) { d.review = { items: [] }; save(); } return; }
    setB('review', true); setE('review', '');
    try {
      const r = await aiJSON(reviewPrompt(ms), { modelTier: 'default' });
      const items = arr(r && r.items).map((it, i) => {
        let key = slug(it && it.key);
        if (!Mistakes.find(key)) key = ms[i] ? ms[i].key : key;
        return { key, rule: str(it && it.rule), exercises: arr(it && it.exercises).map(x => ({ type: x && x.type === 'translate' ? 'translate' : 'fix', prompt: str(x && x.prompt), answer: str(x && x.answer) })).filter(x => x.prompt).slice(0, 2) };
      }).filter(it => it.exercises.length);
      d.review = { items };
      save();
    } catch (e) { setE('review', errText(e)); }
    finally { setB('review', false); }
  }
  async function runFeedback() {
    if (d.feedback || flight.current.feedback) return;
    setB('feedback', true); setE('feedback', '');
    try {
      const exs = d.ex ? 'EXERCISES WITH TODAY\'S PHRASES: ' + d.ex.results.filter(r => r.ok).length + '/' + d.ex.results.length + ' correct.' : '';
      const r = await aiJSON(feedbackPrompt(d.chat, 'This was a daily practice session: a 3-minute warm-up conversation, then corrections, 5 new phrases, an exercise and a review of old mistakes. ' + exs), { modelTier: 'default' });
      d.feedback = normFeedback(r);
      save();
    } catch (e) { setE('feedback', errText(e)); }
    finally { setB('feedback', false); }
  }
  function finishDaily() {
    if (d.recorded) return;
    const m = chatMetrics(d.chat);
    const f = d.feedback;
    recordSession({ mode: 'daily', title: sessionTitle(d.chat), scores: f ? f.scores : null, remember: f ? f.remember : [], strengths: f ? f.strengths : [], calques: countCalques(d.chat), corrections: d.analysis ? d.analysis.corrections.length : 0, minutes: Math.max(1, Math.min(60, Math.round((Date.now() - d.chat.startedAt) / 60000))), words: m.totalWords });
    d.recorded = true; d.done = true;
    save();
  }
  function toStep(n) {
    d.step = n; d.maxStep = Math.max(d.maxStep || 1, n);
    if (n >= 2 && !d.reviewKeys) d.reviewKeys = Mistakes.top(3).map(m => m.key);
    save();
    window.scrollTo(0, 0);
    if (n >= 2) { runAnalysis(); runContent(); if (d.reviewKeys.length) runReview(); }
    if (n >= 5) runFeedback();
  }
  useEffect(() => {
    if (!d.noted) { noteTopic(d.chat.topic || d.chat.scenario); d.noted = true; save(); }
    if (d.step >= 2) { runAnalysis(); runContent(); if (d.reviewKeys && d.reviewKeys.length) runReview(); }
    if (d.step >= 5) runFeedback();
  }, []);
  useEffect(() => { if (d.step === 6 && d.feedback && !d.recorded) finishDaily(); });

  const mine = d.chat.messages.filter(m => m.role === 'me').length;
  const sc = findScenario(d.chat.scenario);
  const Retry = ({ k, fn }) => errs[k] ? html`<div class="chat-err" role="alert"><span>${errs[k]}</span><button class="btn sm" onClick=${fn}>Try again</button></div>` : null;
  const Next = ({ to, label, disabled }) => html`<div class="stepnav"><button class="linkbtn" onClick=${() => toStep(d.step - 1)}><${Icon} n="back" s=${16} /> Back</button><button class="btn primary" disabled=${disabled} onClick=${() => toStep(to)}>${label}</button></div>`;

  let body;
  if (d.step === 1) {
    body = html`<div class="block">
      <div class="warm-h"><div><span class="lbl">Step 1 · Warm-up, about 3 minutes</span><h2 style="font-size:24px">${sessionTitle(d.chat)}</h2></div>
        <div class="row"><${WarmTimer} start=${d.chat.startedAt} /><button class="btn primary" disabled=${mine < 3} onClick=${() => toStep(2)}>Next: corrections</button></div></div>
      <p class="muted">Reply quickly and keep going. Don’t translate in your head: if you don’t know a word, describe it. ${mine < 3 ? 'Write at least ' + (3 - mine) + ' more message' + (3 - mine === 1 ? '' : 's') + ' to continue.' : ''}</p>
      ${sc ? html`<${ScenarioBrief} sc=${sc} />` : null}
      <${ChatView} chat=${chat} composer=${true} />
    </div>`;
  } else if (d.step === 2) {
    body = html`<div class="block">
      <span class="lbl">Step 2 · Your most important corrections</span>
      ${d.analysis ? html`<${Corrections} batch=${{ result: d.analysis, count: mine }} title="Top corrections from the warm-up" hidePhrases=${true} />` : busy.analysis ? html`<${Thinking} label="Reading your messages" />` : null}
      <${Retry} k="analysis" fn=${runAnalysis} />
      <${Next} to=${3} label="Next: 5 phrases" disabled=${!d.analysis} />
    </div>`;
  } else if (d.step === 3) {
    body = html`<div class="block">
      <span class="lbl">Step 3 · 5 phrases for real conversations</span>
      ${d.content ? html`<${PhraseList} list=${d.content.phrases} /><p class="small muted">Saved to My vocabulary. Try to use one of them in your next conversation.</p>` : busy.content ? html`<${Thinking} label="Choosing phrases for you" />` : null}
      <${Retry} k="content" fn=${runContent} />
      <${Next} to=${4} label="Next: use them" disabled=${!d.content} />
    </div>`;
  } else if (d.step === 4) {
    const items = d.content ? d.content.exercises.map(x => ({ type: x.type, prompt: x.prompt, answer: x.answer, target: (d.content.phrases[x.phrase] || {}).en })) : [];
    body = html`<div class="block">
      <span class="lbl">Step 4 · Use today’s phrases</span>
      ${d.content ? html`<${Exercises} items=${items} idPrefix="dx" initial=${d.ex} onChecked=${(res, ans, first) => {
        if (first) { d.content.exercises.forEach((x, i) => { const p = d.content.phrases[x.phrase]; if (p && p.vid && !res[i].skipped) Vocab.bump(p.vid, res[i].ok); }); commit('vocab'); }
        d.ex = { answers: ans, results: res }; save();
      }} />` : busy.content ? html`<${Thinking} label="Preparing the exercise" />` : null}
      <${Retry} k="content" fn=${runContent} />
      <${Next} to=${5} label="Next: review old mistakes" disabled=${!d.content} />
    </div>`;
  } else if (d.step === 5) {
    const its = d.review ? d.review.items : [];
    const flat = [];
    its.forEach(it => { const m = Mistakes.find(it.key); it.exercises.forEach(x => flat.push({ type: x.type, prompt: x.prompt, answer: x.answer, key: it.key, group: m ? m.label : '' })); });
    body = html`<div class="block">
      <span class="lbl">Step 5 · Review your recurring mistakes</span>
      ${d.review ? (its.length ? html`
        ${its.map(it => { const m = Mistakes.find(it.key); const e = m && m.examples[0]; return html`<div class="rv-h"><b>${m ? m.label : it.key}${m ? html` <span class="tag err">×${m.count}</span>` : null}</b>${e ? html`<div class="small"><del>${e.wrong}</del> → <ins>${e.right}</ins></div>` : null}${it.rule ? html`<div class="small">${it.rule}</div>` : null}</div>`; })}
        <${Exercises} items=${flat} idPrefix="rv" initial=${d.rev} onChecked=${(res, ans, first) => {
          if (first) { its.forEach(it => { const idx = flat.map((x, i) => x.key === it.key ? i : -1).filter(i => i >= 0 && !res[i].skipped); if (idx.length) Mistakes.review(it.key, idx.every(i => res[i].ok)); }); commit('mistakes'); }
          d.rev = { answers: ans, results: res }; save();
        }} />` : html`<p class="empty">Nothing to review yet. From tomorrow, this step brings back the mistakes you make most often.</p>`)
      : busy.review || busy.analysis ? html`<${Thinking} label="Preparing your review" />` : null}
      <${Retry} k="review" fn=${runReview} />
      <${Next} to=${6} label="Finish: see my summary" disabled=${false} />
    </div>`;
  } else {
    const exOk = d.ex ? d.ex.results.filter(r => r.ok).length + ' / ' + d.ex.results.length : '–';
    const rvOk = d.rev ? d.rev.results.filter(r => r.ok).length + ' / ' + d.rev.results.length : '–';
    body = html`<div class="block">
      <span class="lbl">Summary</span>
      <div class="ov-sum">
        <div class="ov-item"><span class="lbl">Corrections</span><b>${d.analysis ? d.analysis.corrections.length : 0}</b><small>from the warm-up</small></div>
        <div class="ov-item"><span class="lbl">New phrases</span><b>${d.content ? d.content.phrases.length : 0}</b><small>saved to your list</small></div>
        <div class="ov-item"><span class="lbl">Exercise</span><b>${exOk}</b><small>correct</small></div>
        <div class="ov-item"><span class="lbl">Review</span><b>${rvOk}</b><small>correct</small></div>
      </div>
      ${d.feedback ? html`<${FeedbackPanel} fb=${d.feedback} />` : busy.feedback ? html`<${Thinking} label="Writing your summary" />` : null}
      <${Retry} k="feedback" fn=${runFeedback} />
      <div class="row"><button class="btn primary" onClick=${() => go('home')}>Done for today</button><button class="btn" onClick=${again}>Do another round</button><button class="btn" onClick=${() => go('progress')}>See my progress</button></div>
    </div>`;
  }
  return html`<div class="page">
    <header class="page-h"><h1>Daily practice</h1>
      <div class="steps" aria-label="Steps">${STEPS.map((l, i) => { const n = i + 1; const cls = n === d.step ? ' cur' : n < d.step || n <= (d.maxStep || 1) ? ' done' : ''; return html`<button class=${'step' + cls} disabled=${n > (d.maxStep || 1)} onClick=${() => toStep(n)} aria-current=${n === d.step ? 'step' : null}><i></i><span>${n}. ${l}</span></button>`; })}</div>
    </header>
    ${body}
  </div>`;
}

function StatTile({ dim }) {
  const pts = Store.profile.sessions.filter(s => s.scores && s.scores[dim] != null).slice(-12).map(s => ({ v: s.scores[dim], d: s.date }));
  const [hi, setHi] = useState(-1);
  if (!pts.length) return html`<div class="stat"><span class="stat-l">${DIM_LABEL[dim]}</span><span class="stat-v">–</span><span class="stat-tip">No data yet</span></div>`;
  const last3 = avg(pts.slice(-3).map(p => p.v));
  const prev3 = pts.length > 3 ? avg(pts.slice(-6, -3).map(p => p.v)) : null;
  const delta = prev3 == null ? null : last3 - prev3;
  const W = 160, H = 44, P = 5;
  const x = i => pts.length === 1 ? W / 2 : P + i * (W - 2 * P) / (pts.length - 1);
  const y = v => H - P - (v - 1) / 9 * (H - 2 * P);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ',' + y(p.v).toFixed(1)).join(' ');
  const area = line + ' L' + x(pts.length - 1).toFixed(1) + ',' + (H - P) + ' L' + x(0).toFixed(1) + ',' + (H - P) + ' Z';
  const li = pts.length - 1;
  function move(e) {
    const r = e.currentTarget.getBoundingClientRect();
    const rx = (e.clientX - r.left) / r.width * W;
    let best = 0;
    pts.forEach((p, i) => { if (Math.abs(x(i) - rx) < Math.abs(x(best) - rx)) best = i; });
    setHi(best);
  }
  const dcls = delta == null ? '' : delta > 0.05 ? 'up' : delta < -0.05 ? 'down' : 'flat';
  return html`<div class="stat">
    <span class="stat-l">${DIM_LABEL[dim]}</span>
    <span class="stat-v">${last3.toFixed(1)}<small> /10</small></span>
    ${delta != null ? html`<span class=${'stat-d ' + dcls}>${delta > 0.05 ? '▲ +' : delta < -0.05 ? '▼ ' : '■ '}${delta.toFixed(1)} <span>vs previous 3</span></span>` : html`<span class="stat-d flat"><span>average of last ${Math.min(3, pts.length)}</span></span>`}
    <svg class="spark" viewBox=${'0 0 ' + W + ' ' + H} role="img" aria-label=${DIM_LABEL[dim] + ' over the last ' + pts.length + ' sessions, latest ' + pts[li].v} onPointerMove=${move} onPointerLeave=${() => setHi(-1)}>
      <line class="grid" x1="0" x2=${W} y1=${y(5.5)} y2=${y(5.5)} />
      <path class="area" d=${area} />
      <path class="line" d=${line} />
      ${hi >= 0 ? html`<line class="cross" x1=${x(hi)} x2=${x(hi)} y1="0" y2=${H} />` : null}
      <circle class="end" cx=${x(li)} cy=${y(pts[li].v)} r="4" />
      ${hi >= 0 && hi !== li ? html`<circle class="hov" cx=${x(hi)} cy=${y(pts[hi].v)} r="3.5" />` : null}
    </svg>
    <span class=${'stat-tip' + (hi >= 0 ? ' on' : '')}>${hi >= 0 ? fmtDay(pts[hi].d) + ' · ' + pts[hi].v + '/10' : 'Last ' + pts.length + ' session' + (pts.length === 1 ? '' : 's')}</span>
  </div>`;
}

function Lesson({ m }) {

    ${items.length ? html`<div><span class="lbl">Practice</span><div style="margin-top:8px"><${Exercises} key=${L.id || m.key} items=${items} idPrefix=${'ls-' + m.key} onChecked=${(res, ans, first) => {
      if (!first) return;
      const tried = res.filter(r => !r.skipped);
      if (tried.length) { Mistakes.review(m.key, tried.every(r => r.ok)); commit('mistakes'); toast(tried.every(r => r.ok) ? 'Nice. This mistake will come back less often.' : 'This one will come back again soon.'); }
    }} /></div></div>` : null}

}
function MistakeCard({ m }) {
  const [open, setOpen] = useState(false);
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const [st, stLabel] = Mistakes.status(m);
  const ex = m.examples[0];
  async function lesson(refresh) {
    setBusy(true); setErr('');
    try {
      const r = await aiJSON(lessonPrompt(m), refresh ? { modelTier: 'default', cache: false } : { modelTier: 'default' });
      const L = normLesson(r);
      L.id = uid();
      m.lesson = L;
      commit('mistakes');
    } catch (e) { setErr(errText(e)); }
    finally { setBusy(false); }
  }
  return html`<article class="mcard">
    <button class="mcard-h" onClick=${() => setOpen(!open)} aria-expanded=${open}>
      <span class="mcount">×${m.count}</span>
      <span class="mtitle">${m.label}<small>Last seen ${fmtDay(m.lastSeen)}${m.calques ? ' · ' + m.calques + '× translated from Polish' : ''}</small></span>
      <span class=${'status ' + st}>${stLabel}</span>
    </button>
    ${ex ? html`<div class="mcard-ex">
      <span class="lbl">Your typical mistake</span><span><del>${ex.wrong}</del></span>
      <span class="lbl">Correct</span><span><ins>${ex.right}</ins>${ex.natural && norm(ex.natural) !== norm(ex.right) ? html`<div class="small">More natural: <span class="native">${ex.natural}</span></div>` : null}</span>
      ${ex.why ? html`<p class="why">${ex.why}</p>` : null}
    </div>` : null}
    ${open ? html`<div class="mcard-body">
      ${m.examples.length > 1 ? html`<div><span class="lbl">Other times you made it</span><ul style="margin-top:6px">${m.examples.slice(1).map(e => html`<li class="small"><del>${e.wrong}</del> → <ins>${e.right}</ins></li>`)}</ul></div>` : null}
      ${m.lesson ? html`<${Lesson} m=${m} /><div class="row"><button class="btn sm" disabled=${busy} onClick=${() => lesson(true)}>New exercises</button></div>` : !busy ? html`<div class="row"><button class="btn primary" onClick=${() => lesson(false)}>Explain it and give me an exercise</button><span class="small muted">2 examples, a rule of thumb and 3 short exercises</span></div>` : null}
      ${busy ? html`<${Thinking} label="Preparing a mini-lesson" />` : null}
      ${err ? html`<p class="err" role="alert">${err}</p>` : null}
    </div>` : html`<div style="padding:0 16px 14px"><button class="linkbtn" onClick=${() => setOpen(true)}>Explanation, examples and exercise →</button></div>`}
  </article>`;
}
function MistakesTab() {

function VocabTab({ go }) {

  const count = s => all.filter(v => v.status === s).length;
  const items = all.filter(v => (f === 'all' || v.status === f) && (!q || norm(v.en + ' ' + v.pl).includes(norm(q))));
  async function addPhrase() {
    const t = add.trim();
    if (!t) return;
    setBusy(true); setErr('');
    let v = null;
    try {
      const r = await aiJSON(vocabFillPrompt(t), { modelTier: 'quick' });

    if (v) { commit('vocab'); setAdd(''); toast('Added “' + v.en + '”'); }
    setBusy(false);
  }
  return html`<div class="block">

    <div class="vtools">

      <div class="grow"></div>
      <input id="v-search" class="input" value=${q} onInput=${e => setQ(e.target.value)} placeholder="Search" aria-label="Search your vocabulary" />
    </div>
